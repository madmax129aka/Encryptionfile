# ─────────────────────────────────────────────────────────────
#  SecureVault — "h2" profile: in-memory database, zero setup.
#  Everything resets when the app stops. Great for a quick viva demo.
#      mvn spring-boot:run -Dspring-boot.run.profiles=h2
# ─────────────────────────────────────────────────────────────

spring.datasource.url=jdbc:h2:mem:securevault;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# H2 web console at http://localhost:8080/h2-console (JDBC URL above)
spring.h2.console.enabled=true

securevault.storage.dir=./uploads/encrypted
securevault.seed-demo-user=true
server.port=8080
