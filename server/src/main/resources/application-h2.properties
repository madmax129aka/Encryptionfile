# ─────────────────────────────────────────────────────────────
#  SecureVault — "h2" profile: in-memory database, zero setup.
#  Everything resets when the app stops. Great for a quick local demo.
#      mvn spring-boot:run -Dspring-boot.run.profiles=h2
# ─────────────────────────────────────────────────────────────

# PostgreSQL compatibility mode so behaviour matches the real Render DB.
spring.datasource.url=jdbc:h2:mem:securevault;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# H2 web console at http://localhost:8080/h2-console (use the JDBC URL above)
spring.h2.console.enabled=true

# Store blobs in the (in-memory) DB so the demo needs no disk.
securevault.storage.backend=db
securevault.storage.dir=./uploads/encrypted
securevault.allowed-origins=http://localhost:8080,http://localhost:3000,http://127.0.0.1:5500
securevault.seed-demo-user=true
server.port=8080

# Local HTTP demo: a same-site Lax cookie works and doesn't require HTTPS.
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=false
