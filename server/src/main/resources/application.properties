# ─────────────────────────────────────────────────────────────
#  SecureVault — default profile (PostgreSQL)
#
#  Local:   mvn spring-boot:run        (expects a local Postgres, see below)
#  Render:  set DATABASE_URL (Render injects it) + ALLOWED_ORIGIN, then
#           build: mvn clean package   start: java -jar target/*.jar
#
#  Zero-setup demo (in-memory H2, no DB install):
#           mvn spring-boot:run -Dspring-boot.run.profiles=h2
#
#  ── How the DB connection is resolved ──
#  Render sets DATABASE_URL like:  postgresql://user:pass@host:5432/dbname
#  That is NOT a JDBC URL, so DatabaseUrlConfig (see config/) parses it into
#  proper jdbc:postgresql://... + username + password at startup.
#  For local dev you can instead set the standard Spring vars directly.
# ─────────────────────────────────────────────────────────────

spring.application.name=SecureVault

# --- Datasource ---
# Used ONLY when DATABASE_URL is not present (e.g. local dev). When DATABASE_URL
# is set, DatabaseUrlConfig overrides these three at startup.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/securevault}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# Hibernate will create/update tables to match the entities.
# The provided schema.sql is the canonical Postgres DDL for manual setup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- File upload limits (encrypted blobs) ---
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# --- Server binding ---
# Render provides PORT; bind all interfaces so the container is reachable.
server.port=${PORT:8080}
server.address=0.0.0.0

# --- Session cookie (cross-site) ---
# Frontend Static Site and backend Web Service are on different Render domains,
# so the JSESSIONID cookie must be SameSite=None + Secure to be sent on
# cross-site XHR. (Secure requires HTTPS, which Render provides by default.)
# For purely local HTTP testing, override COOKIE_SAMESITE=Lax and COOKIE_SECURE=false.
server.servlet.session.cookie.same-site=${COOKIE_SAMESITE:None}
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}

# --- CORS: frontend origin(s) allowed to call the API ---
# Comma-separated list. Set to your Render Static Site URL after deploy,
# e.g. https://securevault-frontend.onrender.com
securevault.allowed-origins=${ALLOWED_ORIGIN:http://localhost:8080,http://localhost:3000,http://127.0.0.1:5500}

# --- Encrypted blob storage backend: "db" (Postgres BYTEA) or "filesystem" ---
# On Render the disk is EPHEMERAL (wiped on redeploy/restart), so "db" is the
# safe default there. "filesystem" is fine for a purely local demo.
securevault.storage.backend=${STORAGE_BACKEND:db}
securevault.storage.dir=${STORAGE_DIR:./uploads/encrypted}

# --- Seed the demo user (demo / Demo@1234) on startup ---
securevault.seed-demo-user=${SEED_DEMO_USER:true}
