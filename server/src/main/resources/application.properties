# ─────────────────────────────────────────────────────────────
#  SecureVault — default profile (MySQL 8)
#  Run with:  mvn spring-boot:run
#  For a zero-setup demo (in-memory H2) use the "h2" profile:
#      mvn spring-boot:run -Dspring-boot.run.profiles=h2
# ─────────────────────────────────────────────────────────────

spring.application.name=SecureVault

# --- MySQL connection (edit to match your local MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/securevault?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# Hibernate will create/update tables to match the entities.
# The provided schema.sql is the canonical DDL for reference / manual setup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- File upload limits (encrypted blobs) ---
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# --- Where encrypted blobs are stored on disk ---
securevault.storage.dir=./uploads/encrypted

# --- Seed the demo user (demo / Demo@1234) on startup ---
securevault.seed-demo-user=true

server.port=8080
